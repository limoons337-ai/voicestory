# Fly.io 배포 설정 — 로컬 Dockerfile을 그대로 배포 (git 저장소 불필요)
app = "voicestory"
primary_region = "nrt"   # 도쿄(한국에서 가장 가까운 Fly 리전)

[build]

[env]
  PORT = "8787"
  LLM_BASE_URL = "https://api.groq.com/openai/v1"
  LLM_MODEL = "qwen/qwen3.6-27b"
  FREE_DAILY_TURNS = "30"
  MAX_TOKENS = "320"
  # LLM_API_KEY 는 secret 으로: fly secrets set LLM_API_KEY=gsk_...

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = true      # 미사용 시 절전(콜드스타트). 상시가동 원하면 false
  auto_start_machines = true
  min_machines_running = 0       # 상시가동 원하면 1

[[http_service.checks]]
  method = "GET"
  path = "/api/health"
  interval = "30s"
  timeout = "5s"
